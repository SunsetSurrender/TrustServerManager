[alembic]
script_location = migrations
prepend_sys_path = .

# Nessun sqlalchemy.url qui: la stringa di connessione contiene la password, che viene
# letta da un secret a runtime (migrations/env.py). Metterla in un file di configurazione
# la farebbe finire nell'immagine e nel repo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
