document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

elmet>\n\n<div class=\"{{ themeClass }}\" style=\"display:flex; flex-direction:column; height:100vh; font-family:'Public Sans',Helvetica,sans-serif; color:var(--dd7dde4); background:var(--d0c0f13); overflow:hidden\">\n\n  <!-- Login -->\n  <sc-if value=\"{{ loggedOut }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:200; background:linear-gradient(150deg, #0c0f13 0%, #10141a 55%, #1a0e0e 100%); display:flex; align-items:center; justify-content:center; font-family:'Public Sans',Helvetica,sans-serif\">\n      <div style=\"width:360px; background:#12161c; border:1px solid #2b333d; border-radius:14px; padding:36px 32px; display:flex; flex-direction:column; gap:14px; box-shadow:0 24px 64px rgba(0,0,0,0.6)\">\n        <img src=\"a112e53a-6076-4fda-a0d3-2fa170f03964\" alt=\"Trust Technologies\" style=\"height:26px; align-self:center; display:block\">\n        <div style=\"text-align:center; margin-bottom:6px\">\n          <span style=\"font-size:15px; font-weight:700; color:#e6ecf2; letter-spacing:0.03em\">Server Manager<\u002Fspan>\n          <div style=\"width:44px; height:3px; background:#e2231a; border-radius:2px; margin:8px auto 0\"><\u002Fdiv>\n        <\u002Fdiv>\n        <input placeholder=\"utente\" value=\"{{ loginEmail }}\" sc-camel-on-change=\"{{ onLoginEmail }}\" style=\"width:100%; box-sizing:border-box; background:#0c0f13; border:1px solid #2b333d; border-radius:6px; color:#e6ecf2; padding:10px 12px; font-family:'Roboto Mono',monospace; font-size:13px\">\n        <input placeholder=\"password\" type=\"password\" value=\"{{ loginPw }}\" sc-camel-on-change=\"{{ onLoginPw }}\" sc-camel-on-key-down=\"{{ onLoginKey }}\" style=\"width:100%; box-sizing:border-box; background:#0c0f13; border:1px solid #2b333d; border-radius:6px; color:#e6ecf2; padding:10px 12px; font-family:'Roboto Mono',monospace; font-size:13px\">\n        <sc-if value=\"{{ hasLoginErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px; color:#ff5c5c\">{{ loginErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ doLogin }}\" style=\"background:#e2231a; color:#ffffff; border:none; border-radius:6px; padding:11px 0; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; letter-spacing:0.02em\" style-hover=\"filter:brightness(1.12)\">Accedi<\u002Fbutton>\n        <div style=\"font-size:10.5px; color:#57626f; text-align:center; line-height:1.5\">Prototipo: il privilegio è assegnato in base all'elenco utenze (menu Profilo). L'autenticazione reale arriverà con il backend.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Masthead (larghezza piena) -->\n    <div class=\"np\" style=\"display:flex; align-items:center; gap:12px; padding:8px 24px; background:var(--mast); border-bottom:1px solid var(--mastBorder); position:relative\">\n      <div style=\"flex-shrink:0\">\n        <sc-if value=\"{{ isDarkTheme }}\" hint-placeholder-val=\"{{ true }}\">\n          <img src=\"a112e53a-6076-4fda-a0d3-2fa170f03964\" alt=\"Trust Technologies\" style=\"height:30px; display:block\">\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isLightTheme }}\" hint-placeholder-val=\"{{ false }}\">\n          <img src=\"11d940f0-f6e9-4129-81fd-0cd44570ba9a\" alt=\"Trust Technologies\" style=\"height:30px; display:block\">\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"min-width:0; font-size:14px; font-weight:600; letter-spacing:0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:14px; margin-left:2px; border-left:1px solid var(--mastBorder); color:var(--mastText); opacity:0.92\">Server Manager<\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:10px; flex-shrink:0; margin-left:auto\">\n        <sc-raw-select value=\"{{ locId }}\" sc-camel-on-change=\"{{ onLoc }}\" style=\"background:var(--d12161c); border:1px solid var(--d2b333d); border-radius:6px; color:var(--de6ecf2); padding:7px 8px; font-family:inherit; font-size:13px; font-weight:600\">\n          <sc-for list=\"{{ locOptions }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.id }}\">{{ o.nome }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <div style=\"display:flex; align-items:stretch; border:1px solid var(--d2b333d); border-radius:8px; overflow:hidden\">\n          <button sc-camel-on-click=\"{{ setModeView }}\" title=\"Consultazione in sola lettura\" style=\"{{ modeViewStyle }}\">Visualizzazione<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setModeEdit }}\" title=\"{{ modeEditTip }}\" style=\"{{ modeEditStyle }}\">Editing<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ canAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:relative\">\n            <button sc-camel-on-click=\"{{ toggleSiteForm }}\" style=\"background:var(--d1a2a27); color:var(--accent); border:1px solid var(--d2c4a45); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap\" style-hover=\"background:var(--d21362f)\">+ Sito<\u002Fbutton>\n            <sc-if value=\"{{ siteFormOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"pop-in\" style=\"position:absolute; top:calc(100% + 6px); right:0; width:260px; background:var(--d161b22); border:1px solid var(--d2b333d); border-radius:8px; box-shadow:0 12px 32px var(--sh55); z-index:60; padding:12px 14px; display:flex; flex-direction:column; gap:10px\">\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2)\">NUOVO SITO<\u002Fdiv>\n                <input placeholder=\"Nome (es. Oriolo Romano — A0)\" value=\"{{ siteName }}\" sc-camel-on-change=\"{{ onSiteName }}\" style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <div style=\"display:flex; gap:8px\">\n                  <button sc-camel-on-click=\"{{ saveSite }}\" style=\"flex:1; background:var(--accent); color:var(--d0c0f13); border:none; border-radius:6px; padding:7px 0; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit\" style-hover=\"filter:brightness(1.15)\">Crea<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ toggleSiteForm }}\" style=\"flex:1; background:transparent; color:var(--d8a94a2); border:1px solid var(--d2b333d); border-radius:6px; padding:7px 0; font-size:12px; cursor:pointer; font-family:inherit\">Annulla<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <div class=\"app-main\" style=\"display:flex; flex:1; min-height:0\">\n  <div data-screen-label=\"Pianta\" style=\"flex:1; min-width:0; display:flex; flex-direction:column\">\n\n    <!-- Barra strumenti -->\n    <div class=\"np\" style=\"display:flex; align-items:center; gap:10px; padding:10px 24px; border-bottom:1px solid var(--d1e252e); background:var(--d10141a); flex-wrap:wrap\">\n\n        <div style=\"display:flex; align-items:stretch; border:1px solid var(--d2b333d); border-radius:8px; background:var(--d161b22); overflow:hidden\">\n          <button sc-camel-on-click=\"{{ toggleDash }}\" style=\"{{ dashBtnStyle }}\" style-hover=\"filter:brightness(1.2)\">Dashboard<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ showPianta }}\" style=\"{{ piantaBtnStyle }}\" style-hover=\"filter:brightness(1.2)\">Pianta<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleInv }}\" style=\"{{ invBtnStyle }}\" style-hover=\"filter:brightness(1.2)\">Inventario<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleCap }}\" style=\"{{ capBtnStyle }}\" style-hover=\"filter:brightness(1.2)\">Capacità<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleScad }}\" style=\"{{ scadBtnStyle }}\" style-hover=\"filter:brightness(1.2)\">{{ scadTabLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <div style=\"position:relative; flex:1; max-width:460px; min-width:220px; margin:0 12px\">\n        <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" title=\"Scorciatoie: /  o  Ctrl+F  —  supporta range IP: 10.0.2.0/24, 10.0.0.1-10.0.0.99, 10.0.*\" placeholder=\"Cerca nome, seriale, rack, IP o range\" style=\"width:100%; box-sizing:border-box; background:var(--d12161c); border:1px solid var(--d2b333d); border-radius:6px; color:var(--de6ecf2); padding:9px 12px; font-family:'Roboto Mono',monospace; font-size:13px\">\n        <sc-if value=\"{{ hasResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"pop-in\" style=\"position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--d161b22); border:1px solid var(--d2b333d); border-radius:8px; box-shadow:0 12px 32px var(--sh55); z-index:50; max-height:340px; overflow-y:auto\">\n            <sc-for list=\"{{ results }}\" as=\"res\" hint-placeholder-count=\"0\">\n              <div sc-camel-tab-index=\"0\" data-kb=\"1\" sc-camel-on-click=\"{{ res.onClick }}\" style=\"display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--d1e252e)\" style-hover=\"background:var(--d1c232c)\">\n                <span style=\"{{ res.dotStyle }}\"><\u002Fspan>\n                <span style=\"font-family:'Roboto Mono',monospace; font-size:13px; font-weight:500\">{{ res.label }}<\u002Fspan>\n                <span style=\"font-size:11px; color:var(--d7c8794); margin-left:auto; font-family:'Roboto Mono',monospace; white-space:nowrap\">{{ res.sub }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"pop-in\" style=\"position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--d161b22); border:1px solid var(--d2b333d); border-radius:8px; z-index:50; padding:10px 12px; font-size:12px; color:var(--d7c8794)\">Nessun risultato in nessuna sala<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n        <div style=\"position:relative; margin-left:auto\">\n          <label style=\"background:var(--d161b22); color:var(--dd7dde4); border:1px solid var(--d2b333d); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; display:inline-block\" title=\"Confronta i dati attuali con un rilievo precedente (JSON, CSV o Excel)\" style-hover=\"color:var(--accent); border-color:var(--d2c4a45)\">⇄ Confronta\n            <input type=\"file\" accept=\".json,.csv,.xlsx\" sc-camel-on-change=\"{{ onDiffFile }}\" style=\"display:none\">\n          <\u002Flabel>\n          <sc-if value=\"{{ diffOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"pop-in\" style=\"position:absolute; top:calc(100% + 6px); right:0; width:420px; max-height:380px; overflow-y:auto; background:var(--d161b22); border:1px solid var(--d2b333d); border-radius:8px; box-shadow:0 12px 32px var(--sh55); z-index:60; padding:12px 14px\">\n              <div style=\"display:flex; align-items:center; margin-bottom:8px\">\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2)\">CONFRONTO CON RILIEVO CARICATO<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ closeDiff }}\" style=\"margin-left:auto; background:transparent; color:var(--d8a94a2); border:none; cursor:pointer; font-size:14px\">✕<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-for list=\"{{ diffRows }}\" as=\"dr\" hint-placeholder-count=\"0\">\n                <div style=\"{{ dr.style }}\">{{ dr.txt }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ hasDiffReport }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--d2b333d)\">\n                  <button sc-camel-on-click=\"{{ diffExportXlsx }}\" style=\"{{ diffXlsxBtnStyle }}\" style-hover=\"filter:brightness(1.15)\">↓ Report Excel<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ diffExportCsv }}\" style=\"flex:1; background:transparent; color:var(--d8a94a2); border:1px solid var(--d2b333d); border-radius:6px; padding:7px 0; font-size:11.5px; cursor:pointer; font-family:inherit\" style-hover=\"color:var(--dd7dde4)\">↓ Report CSV<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ canEdit }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ undo }}\" title=\"Annulla l'ultima modifica (Ctrl+Z)\" style=\"{{ undoBtnStyle }}\" style-hover=\"filter:brightness(1.2)\">↩ Annulla{{ undoCount }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ canEdit }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ redo }}\" title=\"Ripristina la modifica annullata (Ctrl+Y)\" style=\"{{ redoBtnStyle }}\" style-hover=\"filter:brightness(1.2)\">↪ Ripristina{{ redoCount }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"position:relative\">\n          <button sc-camel-on-click=\"{{ toggleExp }}\" style=\"background:var(--d161b22); color:var(--dd7dde4); border:1px solid var(--d2b333d); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0\" style-hover=\"color:var(--accent); border-color:var(--d2c4a45)\">Esporta ▾<\u002Fbutton>\n          <sc-if value=\"{{ expOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"pop-in\" style=\"position:absolute; top:calc(100% + 6px); right:0; width:230px; background:var(--d161b22); border:1px solid var(--d2b333d); border-radius:8px; box-shadow:0 12px 32px var(--sh55); z-index:60; padding:6px\">\n              <div sc-camel-on-click=\"{{ expJson }}\" style=\"padding:9px 12px; border-radius:6px; cursor:pointer; font-size:12.5px; color:var(--dd7dde4)\" style-hover=\"background:var(--d1c232c)\">JSON completo<div style=\"font-size:10.5px; color:var(--d57626f); margin-top:2px\">Struttura + inventario + registro<\u002Fdiv><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ expCsv }}\" style=\"padding:9px 12px; border-radius:6px; cursor:pointer; font-size:12.5px; color:var(--dd7dde4)\" style-hover=\"background:var(--d1c232c)\">CSV dispositivi<div style=\"font-size:10.5px; color:var(--d57626f); margin-top:2px\">Tutti i dispositivi, riimportabile<\u002Fdiv><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ expXlsx }}\" style=\"padding:9px 12px; border-radius:6px; cursor:pointer; font-size:12.5px; color:var(--dd7dde4)\" style-hover=\"background:var(--d1c232c)\">Excel (.xlsx)<div style=\"font-size:10.5px; color:var(--d57626f); margin-top:2px\">Fogli Dispositivi, Rack e Sale formattati<\u002Fdiv><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ expPrint }}\" style=\"padding:9px 12px; border-radius:6px; cursor:pointer; font-size:12.5px; color:var(--dd7dde4)\" style-hover=\"background:var(--d1c232c)\">Stampa / PDF<div style=\"font-size:10.5px; color:var(--d57626f); margin-top:2px\">Pianta della sala corrente<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"position:relative\">\n          <button sc-camel-on-click=\"{{ toggleReg }}\" style=\"background:var(--d161b22); color:var(--dd7dde4); border:1px solid var(--d2b333d); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0\" style-hover=\"color:var(--accent); border-color:var(--d2c4a45)\">Registro<\u002Fbutton>\n          <sc-if value=\"{{ regOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"pop-in\" style=\"position:absolute; top:calc(100% + 6px); right:0; width:360px; max-height:320px; overflow-y:auto; background:var(--d161b22); border:1px solid var(--d2b333d); border-radius:8px; box-shadow:0 12px 32px var(--sh55); z-index:60; padding:10px 12px\">\n              <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2); margin-bottom:8px\">REGISTRO MODIFICHE (sessione)<\u002Fdiv>\n              <sc-if value=\"{{ regEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12px; color:var(--d57626f)\">Nessuna modifica registrata.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ regRows }}\" as=\"rg\" hint-placeholder-count=\"0\">\n                <div style=\"font-family:'Roboto Mono',monospace; font-size:11px; color:var(--d7c8794); padding:4px 0; border-bottom:1px solid var(--d1e252e)\">{{ rg.txt }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleProfile }}\" title=\"{{ profileTip }}\" style=\"{{ profileBtnStyle }}\" style-hover=\"filter:brightness(1.15)\">{{ userInitials }}<\u002Fbutton>\n        <div style=\"position:relative; flex-shrink:0\">\n          <button sc-camel-on-click=\"{{ toggleAccount }}\" style=\"background:var(--d161b22); color:var(--dd7dde4); border:1px solid var(--d2b333d); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0\" style-hover=\"color:var(--accent); border-color:var(--d2c4a45)\">⚙ Impostazioni<\u002Fbutton>\n          <sc-if value=\"{{ accountOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"pop-in\" style=\"position:absolute; top:calc(100% + 6px); right:0; width:300px; max-height:calc(100vh - 240px); overflow-y:auto; background:var(--d161b22); border:1px solid var(--d2b333d); border-radius:8px; box-shadow:0 12px 32px var(--sh55); z-index:60; padding:14px 16px; display:flex; flex-direction:column; gap:16px\">\n              \n              <div>\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2); margin-bottom:8px\">MANUALE D'USO<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ toggleManual }}\" style=\"width:100%; background:transparent; color:var(--dd7dde4); border:1px solid var(--d2b333d); border-radius:6px; padding:8px 0; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit\" style-hover=\"border-color:var(--d3a4552)\">Apri il manuale<\u002Fbutton>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2); margin-bottom:8px\">ANNULLA MODIFICHE<\u002Fdiv>\n                <label style=\"display:flex; align-items:center; gap:8px; font-size:12px; color:var(--d7c8794)\">Modifiche in memoria\n                  <sc-raw-select value=\"{{ undoDepth }}\" sc-camel-on-change=\"{{ onUndoDepth }}\" style=\"background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:5px 6px; font-family:inherit; font-size:12px\">\n                    <option value=\"5\">5<\u002Foption><option value=\"10\">10<\u002Foption><option value=\"15\">15<\u002Foption><option value=\"20\">20<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2); margin-bottom:8px\">TEMA<\u002Fdiv>\n                <div style=\"display:flex; gap:6px\">\n                  <button sc-camel-on-click=\"{{ setDark }}\" style=\"{{ darkBtnStyle }}\">Scuro<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ setLight }}\" style=\"{{ lightBtnStyle }}\">Chiaro<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ setTim }}\" style=\"{{ timBtnStyle }}\">TIM<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:8px\">\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2)\">NOTIFICHE SCADENZE<\u002Fdiv>\n                <label style=\"display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dd7dde4); cursor:pointer\">\n                  <input type=\"checkbox\" checked=\"{{ notAttive }}\" sc-camel-on-change=\"{{ onNotAttive }}\"> Promemoria via email\n                <\u002Flabel>\n                <input placeholder=\"email destinatario\" value=\"{{ notEmail }}\" sc-camel-on-change=\"{{ onNotEmail }}\" style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <label style=\"display:flex; align-items:center; gap:8px; font-size:12px; color:var(--d7c8794)\">Anticipo (giorni)\n                  <input type=\"number\" min=\"1\" max=\"365\" value=\"{{ notGiorni }}\" sc-camel-on-change=\"{{ onNotGiorni }}\" style=\"width:70px; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:5px 8px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <\u002Flabel>\n                <div style=\"font-size:11px; color:var(--dd9a13f); font-family:'Roboto Mono',monospace\">{{ notPreview }}<\u002Fdiv>\n                <div style=\"font-size:10.5px; color:var(--d57626f)\">L'invio effettivo si attiva con il backend; la configurazione viaggia nell'export JSON.<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ isAdminUser }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; flex-direction:column; gap:8px\">\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2)\">SERVER SMTP<\u002Fdiv>\n                <div style=\"display:flex; gap:8px\">\n                  <input placeholder=\"host (es. smtp.azienda.it)\" value=\"{{ smtpHost }}\" sc-camel-on-change=\"{{ onSmtpHost }}\" style=\"flex:2; min-width:0; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                  <input placeholder=\"porta\" type=\"number\" min=\"1\" max=\"65535\" value=\"{{ smtpPorta }}\" sc-camel-on-change=\"{{ onSmtpPorta }}\" style=\"flex:1; min-width:0; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <\u002Fdiv>\n                <input placeholder=\"utente\" value=\"{{ smtpUser }}\" sc-camel-on-change=\"{{ onSmtpUser }}\" sc-camel-auto-complete=\"off\" style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <input placeholder=\"password\" type=\"password\" value=\"{{ smtpPass }}\" sc-camel-on-change=\"{{ onSmtpPass }}\" sc-camel-auto-complete=\"new-password\" style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <input placeholder=\"mittente (es. ced@azienda.it)\" value=\"{{ smtpFrom }}\" sc-camel-on-change=\"{{ onSmtpFrom }}\" style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <label style=\"display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dd7dde4); cursor:pointer\">\n                  <input type=\"checkbox\" checked=\"{{ smtpTls }}\" sc-camel-on-change=\"{{ onSmtpTls }}\"> TLS/STARTTLS\n                <\u002Flabel>\n                <div style=\"font-size:10.5px; color:var(--d57626f)\">Usati dal job di invio lato server. La password viene salvata in chiaro nel JSON: in produzione va spostata in un secret del backend.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:8px\">\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2)\">IMPORTA DATI<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ scaricaModello }}\" style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Public Sans',sans-serif; font-size:12px; cursor:pointer; text-align:left\" style-hover=\"border-color:var(--d3a4552)\">↓ Scarica modello Excel da compilare<\u002Fbutton>\n                <label style=\"display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--d7c8794)\">Righe già presenti\n                  <sc-raw-select value=\"{{ impMode }}\" sc-camel-on-change=\"{{ onImpMode }}\" style=\"flex:1; min-width:0; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:5px 6px; font-family:inherit; font-size:11.5px\">\n                    <option value=\"merge\">aggiorna i dispositivi esistenti<\u002Foption>\n                    <option value=\"new\">salta: inserisci solo i nuovi<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <sc-if value=\"{{ impNeedsEdit }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:11px; color:var(--dd9a13f)\">Per importare passa in modalità Editing (Ctrl+E): in Visualizzazione i dati non sono modificabili.<\u002Fdiv>\n                <\u002Fsc-if>\n                <label style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Public Sans',sans-serif; font-size:12px; cursor:pointer; display:block\" style-hover=\"border-color:var(--d3a4552)\">↑ Analizza file CSV o Excel…\n                  <input type=\"file\" accept=\".csv,.xlsx\" sc-camel-on-change=\"{{ onImportCsv }}\" style=\"display:none\">\n                <\u002Flabel>\n                <sc-if value=\"{{ impPreviewOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border:1px solid var(--d2b333d); border-radius:6px; background:var(--d0c0f13); padding:10px; display:flex; flex-direction:column; gap:6px\">\n                    <div style=\"font-size:11.5px; font-weight:700; color:var(--dd7dde4)\">{{ impFileName }}<\u002Fdiv>\n                    <div style=\"font-size:11px; color:var(--d8a94a2); font-family:'Roboto Mono',monospace\">{{ impSummary }}<\u002Fdiv>\n                    <div style=\"max-height:170px; overflow-y:auto\">\n                      <sc-for list=\"{{ impRows }}\" as=\"ip\" hint-placeholder-count=\"0\">\n                        <div style=\"{{ ip.style }}\">{{ ip.txt }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"font-size:10.5px; color:var(--d57626f)\">Nulla è stato ancora scritto. Applicando l'import potrai comunque annullare con ↩ Annulla.<\u002Fdiv>\n                    <div style=\"display:flex; gap:8px\">\n                      <sc-if value=\"{{ impCanApply }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button sc-camel-on-click=\"{{ impApply }}\" style=\"{{ impApplyBtnStyle }}\" style-hover=\"filter:brightness(1.12)\">Applica import<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <button sc-camel-on-click=\"{{ impCancel }}\" style=\"flex:1; background:transparent; color:var(--d8a94a2); border:1px solid var(--d2b333d); border-radius:6px; padding:7px 0; font-size:11.5px; cursor:pointer; font-family:inherit\" style-hover=\"color:var(--dd7dde4)\">Annulla<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <label style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Public Sans',sans-serif; font-size:12px; cursor:pointer; display:block\" style-hover=\"border-color:var(--d3a4552)\">↑ Ripristina backup JSON completo…\n                  <input type=\"file\" accept=\".json\" sc-camel-on-change=\"{{ onImportFile }}\" style=\"display:none\">\n                <\u002Flabel>\n                <div style=\"font-size:10.5px; color:var(--d57626f)\">Il CSV/Excel aggiunge o aggiorna solo i dispositivi indicati. Il JSON sostituisce integralmente i dati: usalo solo per ripristinare un backup.<\u002Fdiv>\n              <\u002Fdiv>\n              \n              <\u002Fsc-if>\n              \n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <!-- Dashboard riepilogo -->\n    <sc-if value=\"{{ dashOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"view-in\" style=\"flex:1; min-height:0; overflow:auto; padding:20px 24px\">\n        <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom:14px\">\n          <div style=\"font-size:13px; font-weight:700\">Riepilogo CED<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Riga 1: KPI + occupazione -->\n        <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,1fr); gap:12px; align-items:stretch\">\n          <div style=\"display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); grid-auto-rows:1fr; gap:10px\">\n            <sc-for list=\"{{ dashCards }}\" as=\"dcx\" hint-placeholder-count=\"4\">\n              <div sc-camel-tab-index=\"0\" data-kb=\"1\" sc-camel-on-click=\"{{ dcx.onClick }}\" style=\"border:1px solid var(--d1e252e); border-radius:8px; padding:10px 12px; background:var(--d10141a); cursor:pointer; min-width:0\" style-hover=\"background:var(--d1c232c); transform:translateY(-2px); box-shadow:0 6px 18px var(--sh35)\">\n                <div style=\"font-size:11px; font-weight:600; color:var(--d7c8794); white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ dcx.label }}<\u002Fdiv>\n                <div style=\"{{ dcx.valStyle }}\">{{ dcx.value }}<\u002Fdiv>\n                <div style=\"font-size:10.5px; color:var(--d7c8794); white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ dcx.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--d1e252e); border-radius:8px; padding:14px; background:var(--d10141a); display:flex; flex-direction:column; min-width:0\">\n            <div style=\"font-size:10.5px; font-weight:700; letter-spacing:0.07em; color:var(--d8a94a2)\">OCCUPAZIONE COMPLESSIVA<\u002Fdiv>\n            <div style=\"font-family:'Roboto Mono',monospace; font-size:12px; color:var(--dd7dde4); margin-top:10px\">{{ dashOccLabel }}<\u002Fdiv>\n            <div style=\"height:10px; background:var(--d2b333d); border-radius:4px; overflow:hidden; margin-top:8px\"><div style=\"{{ dashOccBar }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:10.5px; font-weight:700; letter-spacing:0.07em; color:var(--d8a94a2); margin-top:16px\">PER TIPO<\u002Fdiv>\n            <div style=\"display:flex; height:14px; border-radius:4px; overflow:hidden; margin-top:6px; background:var(--d2b333d)\">\n              <sc-for list=\"{{ dashTypeSegs }}\" as=\"seg\" hint-placeholder-count=\"4\">\n                <div title=\"{{ seg.title }}\" style=\"{{ seg.style }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:12px; flex-wrap:wrap; margin-top:10px\">\n              <sc-for list=\"{{ dashTypes }}\" as=\"dt\" hint-placeholder-count=\"5\">\n                <span style=\"display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dd7dde4); white-space:nowrap\">\n                  <span style=\"{{ dt.dotStyle }}\"><\u002Fspan>{{ dt.label }}\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Riga 2: urgenze e scadenze -->\n        <div sc-camel-tab-index=\"0\" data-kb=\"1\" sc-camel-on-click=\"{{ dashAlertGo }}\" style=\"{{ dashAlertBoxStyle }}\" style-hover=\"background:var(--d1c232c)\">\n          <div style=\"font-size:10.5px; font-weight:700; letter-spacing:0.07em; color:var(--d8a94a2); flex-shrink:0\">URGENZE E SCADENZE<\u002Fdiv>\n          <sc-if value=\"{{ dashNoAlerts }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"display:flex; align-items:center; gap:7px; font-size:12.5px; color:#3ddc84\"><span style=\"width:8px; height:8px; border-radius:50%; background:#3ddc84; display:inline-block\"><\u002Fspan>Nessuna urgenza o scadenza imminente<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ dashHasAlerts }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"{{ dashAlertSummaryStyle }}\">{{ dashAlertSummary }}<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ dashHasAlerts }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"margin-left:auto; font-size:12px; font-weight:600; color:var(--accent); white-space:nowrap; flex-shrink:0\">Vedi dettagli →<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"font-size:10.5px; font-weight:7  <div style=\"display:grid; grid-template-columns:1fr 0.8fr 0.9fr 1.6fr 1.2fr 1fr 0.7fr 1.1fr; border-bottom:1px solid var(--d2b333d)\">\n          <sc-for list=\"{{ scadCols }}\" as=\"sc\" hint-placeholder-count=\"8\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.05em; color:var(--d8a94a2); padding:6px 10px 8px 0\">{{ sc }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ scadRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n          <div sc-camel-tab-index=\"0\" data-kb=\"1\" sc-camel-on-click=\"{{ row.onClick }}\" style=\"display:grid; grid-template-columns:1fr 0.8fr 0.9fr 1.6fr 1.2fr 1fr 0.7fr 1.1fr; cursor:pointer; border-bottom:1px solid var(--d1e252e)\" style-hover=\"background:var(--d1c232c)\">\n            <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"8\">\n              <div style=\"{{ cell.style }}\">{{ cell.txt }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ scadEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:24px 0; font-size:12.5px; color:var(--d57626f)\">Nessuna garanzia o scadenza di supporto registrata sui dispositivi.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Capacità globale -->\n    <sc-if value=\"{{ capOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"view-in\" style=\"flex:1; min-height:0; overflow:auto; padding:16px 24px\">\n        <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom:6px\">\n          <div style=\"font-size:13px; font-weight:700\">Capacità CED — unità rack libere e occupate<\u002Fdiv>\n          <div style=\"font-size:11px; color:var(--d57626f)\">Clicca una sala per aprirla · «miglior slot» = blocco contiguo libero più grande<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ capLocs }}\" as=\"cl\" hint-placeholder-count=\"2\">\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--d8a94a2); margin:16px 0 8px\">{{ cl.nome }}<\u002Fdiv>\n          <sc-for list=\"{{ cl.rooms }}\" as=\"cr\" hint-placeholder-count=\"4\">\n            <div sc-camel-tab-index=\"0\" data-kb=\"1\" sc-camel-on-click=\"{{ cr.onClick }}\" style=\"border:1px solid var(--d1e252e); border-radius:8px; padding:12px 14px; margin-bottom:10px; cursor:pointer; background:var(--d10141a)\" style-hover=\"background:var(--d1c232c)\">\n              <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap\">\n                <div style=\"font-weight:600; font-size:13px\">{{ cr.nome }}<\u002Fdiv>\n                <div style=\"font-size:11px; color:var(--d7c8794)\">{{ cr.sum }}<\u002Fdiv>\n                <div style=\"margin-left:auto; font-family:'Roboto Mono',monospace; font-size:11px; color:var(--accent)\">{{ cr.best }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:8px; background:var(--d2b333d); border-radius:4px; overflow:hidden; margin-top:8px\"><div style=\"{{ cr.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:8px\">\n                <sc-for list=\"{{ cr.rows }}\" as=\"fr\" hint-placeholder-count=\"2\">\n                  <span style=\"font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--d8a94a2); border:1px solid var(--d2b333d); border-radius:4px; padding:2px 8px\">{{ fr }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Profilo utente -->\n    <sc-if value=\"{{ profileOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"view-in\" style=\"flex:1; min-height:0; overflow:auto; padding:24px\">\n        <div style=\"max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:16px\">\n          <div style=\"display:flex assword\" placeholder=\"Password attuale\" value=\"{{ pwCur }}\" sc-camel-on-change=\"{{ onPwCur }}\" style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <input type=\"password\" placeholder=\"Nuova password (min 8)\" value=\"{{ pwNew }}\" sc-camel-on-change=\"{{ onPwNew }}\" style=\"width:100%; box-sizing:border-box; background:var(--d0c0f13); border:1px solid var(--d2b333d); border-radius:4px; color:var(--de6ecf2); padding:7px 9px; font-family:'Roboto Mono',monospace; font-size:12px\">\n                <div style=\"display:flex; gap:8px\">\n                  <button sc-camel-on-click=\"{{ savePw }}\" style=\"flex:1; background:var(--accent); color:var(--d0c0f13); border:none; border-radius:6px; padding:7px 0; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit\" style-hover=\"filter:brightness(1.15)\">Aggiorna<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ resetPw }}\" style=\"flex:1; background:transparent; color:var(--d8a94a2); border:1px solid var(--d2b333d); border-radius:6px; padding:7px 0; font-size:12px; cursor:pointer; font-family:inherit\" style-hover=\"color:var(--dd7dde4)\">Reimposta<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasPwMsg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:11.5px; color:var(--dd9a13f); font-family:'Roboto Mono',monospace\">{{ pwMsg }}<\u002Fdiv>\n                <\u002Fsc-if>\n            <\u002Fdiv>\n          <sc-if value=\"{{ isAdminUser }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid var(--d2b333d); border-radius:10px; background:var(--d10141a); padding:16px 18px; display:flex; flex-direction:column; gap:10px\">\n              <div style=\"font-size:12.5px; font-weight:700; letter-spacing:0.06em; color:va
