# /etc/systemd/journald.conf.d/tsm.conf — tetto al journal di sistema.
# Il journal raccoglie i log di systemd, di docker.service, di tsm.service e di
# tsm-autoheal: senza limite su un disco di sistema piccolo cresce finché c'è spazio.
[Journal]
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=90day
