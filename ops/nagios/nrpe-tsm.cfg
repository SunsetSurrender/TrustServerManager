# /etc/nrpe.d/tsm.cfg — controlli di Trust Server Manager (ops/README.md §1)
# Nessun argomento passato dal server Nagios (dont_blame_nrpe resta 0):
# ogni comando è fisso.
command[check_tsm_service]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh service
command[check_tsm_containers]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh containers
command[check_tsm_worker]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh worker
command[check_tsm_runs]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh runs
command[check_tsm_maintenance]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh maintenance
command[check_tsm_ready]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh ready
command[check_tsm_storage]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh storage
command[check_tsm_cert]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh cert
command[check_tsm_images]=/usr/bin/sudo -n /usr/local/lib/tsm/check_tsm.sh images
