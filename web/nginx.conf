worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Percorsi scrivibili sotto /tmp: il container gira read-only e non-root.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile      on;
    server_tokens off;

    # Primo dei due limiti di dimensione (§8.24). L'altro è nell'applicazione,
    # perché questo vale solo per chi passa da qui.
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # ---------------- API ----------------
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # L'inventario non si mette in cache da nessuna parte: l'API manda
            # no-store, e qui non si aggiunge nulla che possa contraddirlo.
            proxy_buffering off;
        }

        # ------------- file statici in allowlist (§6) -------------
        # L'immagine contiene SOLO questi file: quello che non è stato copiato non
        # può essere servito nemmeno da una regola scritta male in futuro.
        location = / {
            root /srv/app;
            try_files /index.html =404;
        }

        location = /support.js { root /srv/app; }
        location = /xlsx.js    { root /srv/app; }
        location = /identity.js { root /srv/app; }
        location = /trust-logo.png      { root /srv/app; }
        location = /trust-logo-dark.png { root /srv/app; }

        location ^~ /vendor/ {
            root /srv/app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location ^~ /fonts/ {
            root /srv/app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Default deny: nessun autoindex, nessuna directory servita in blocco.
        location / { return 404; }
    }
}
