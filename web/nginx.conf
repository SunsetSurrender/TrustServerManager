worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Percorsi scrivibili sotto /tmp: il container gira read-only e non-root.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile      on;
    server_tokens off;

    # Primo dei due limiti di dimensione (§8.24). L'altro è nell'applicazione,
    # perché questo vale solo per chi passa da qui.
    #
    # 11m e non 5m da quando esiste il caricamento delle foto: un'immagine può
    # arrivare a 10 MB più l'involucro multipart (§8.5). Questo resta un limite
    # GROSSOLANO — il suo lavoro è impedire che un corpo enorme arrivi fino
    # all'applicazione — e i limiti precisi sono dell'applicazione, che sa quale
    # endpoint è stato chiamato: 5 MB per tutto, 10 MB per il solo
    # `POST /api/photos`, 4 MB per il documento dell'inventario (§8.16).
    #
    # L'alternativa sarebbe una `location = /api/photos` con un limite proprio, e
    # significherebbe duplicare qui le sei intestazioni `X-Forwarded-*` di
    # `location /api/`: nginx non le eredita fra location sorelle, e due copie di
    # quelle righe sono un difetto di sicurezza che aspetta il primo aggiornamento
    # fatto in un posto solo (§8.34).
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # >>> SYNC:LISTENERS-BEGIN  (sostituito da tools/sync-nginx-dev.py)
    # ------------------------------------------------------------------
    # HTTP: solo reindirizzamento. Il cookie di sessione è `Secure`, quindi su
    # HTTP non funzionerebbe comunque nulla; meglio dirlo con un 301 che lasciare
    # credere che il servizio risponda in chiaro.
    #
    # `$host` e NON `$http_host`: `$host` non porta la porta. In produzione i
    # mapping sono host 80 -> 8080 e host 443 -> 8443, quindi il client vede solo
    # le porte standard e il reindirizzamento non deve fabbricare una porta
    # esplicita — vedi §8.31 sul perché HSTS e porte non standard non convivono.
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ------------------------------------------------------------------
    # HTTPS
    # ------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        # Certificato e chiave montati dall'infrastruttura. Non sono `secrets:` di
        # Compose perché nginx li deve leggere all'avvio come file normali.
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS: SOLO su questo listener, e solo perché in produzione è raggiunto
        # sulla porta 443 standard.
        #
        # HSTS si applica all'HOST e conserva la porta esplicita della richiesta:
        # con un servizio esposto su http://host:8080, il browser che ha visto
        # HSTS trasformerebbe quella URL in https://host:8080 — dove nginx parla
        # HTTP in chiaro. Il reindirizzamento verrebbe scavalcato e la richiesta
        # fallirebbe in modo incomprensibile (§8.31).
        #
        # Quindi: porte standard sull'host (80/443), HSTS solo qui, e nessun HSTS
        # nella configurazione di sviluppo, che usa porte non standard.
        add_header Strict-Transport-Security "max-age=31536000" always;

        add_header X-Content-Type-Options nosniff always;
    # >>> SYNC:LISTENERS-END

        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # ---------------- API ----------------
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            # Le intestazioni `X-Forwarded-*` si SOVRASCRIVONO, mai si accodano
            # e mai si lasciano passare (§8.34). Sono le uniche affermazioni che
            # l'API accetta da noi, e quindi devono venire da noi soltanto.
            #
            # `$remote_addr` e NON `$proxy_add_x_forwarded_for`: quest'ultimo
            # ACCODA l'IP reale a un eventuale header del client, quindi un
            # `X-Forwarded-For: 1.2.3.4` inviato dall'esterno arriverebbe all'API
            # come "1.2.3.4, <ip reale>". L'API prende un valore da quella lista e
            # il chiamante avrebbe scelto il proprio indirizzo — aggirando il
            # limitatore dei tentativi di accesso semplicemente cambiando stringa.
            #
            # `X-Forwarded-Host` va impostato ANCHE SE non ci serve valorizzarlo
            # diversamente da `$host`: se non lo si scrive, quello del client passa
            # intatto, e l'API — che si fida degli header quando il peer è il proxy
            # — costruirebbe l'origine attesa con un valore scelto dall'attaccante.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # L'inventario non si mette in cache da nessuna parte: l'API manda
            # no-store, e qui non si aggiunge nulla che possa contraddirlo.
            proxy_buffering off;
        }

        # ------------- file statici in allowlist (§6) -------------
        # L'immagine contiene SOLO questi file: quello che non è stato copiato non
        # può essere servito nemmeno da una regola scritta male in futuro.
        location = / {
            root /srv/app;
            try_files /index.html =404;
        }

        location = /support.js { root /srv/app; }
        location = /xlsx.js    { root /srv/app; }
        location = /identity.js { root /srv/app; }
        location = /api.js     { root /srv/app; }
        location = /trust-logo.png      { root /srv/app; }
        location = /trust-logo-dark.png { root /srv/app; }

        location ^~ /vendor/ {
            root /srv/app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location ^~ /fonts/ {
            root /srv/app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Default deny: nessun autoindex, nessuna directory servita in blocco.
        location / { return 404; }
    }
}
