# GENERATO da tools/sync-nginx-dev.py a partire da web/nginx.conf.
# Differenza unica: nessun TLS e nessun HSTS, un solo server in chiaro su 8080.
# Rigenerare dopo ogni modifica a nginx.conf, così le due configurazioni non
# divergono su tutto il resto (allowlist, proxy, limiti, intestazioni).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Percorsi scrivibili sotto /tmp: il container gira read-only e non-root.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile      on;
    server_tokens off;

    # Primo dei due limiti di dimensione (§8.24). L'altro è nell'applicazione,
    # perché questo vale solo per chi passa da qui.
    #
    # 11m e non 5m da quando esiste il caricamento delle foto: un'immagine può
    # arrivare a 10 MB più l'involucro multipart (§8.5). Questo resta un limite
    # GROSSOLANO — il suo lavoro è impedire che un corpo enorme arrivi fino
    # all'applicazione — e i limiti precisi sono dell'applicazione, che sa quale
    # endpoint è stato chiamato: 5 MB per tutto, 10 MB per il solo
    # `POST /api/photos`, 4 MB per il documento dell'inventario (§8.16).
    #
    # L'alternativa sarebbe una `location = /api/photos` con un limite proprio, e
    # significherebbe duplicare qui le sei intestazioni `X-Forwarded-*` di
    # `location /api/`: nginx non le eredita fra location sorelle, e due copie di
    # quelle righe sono un difetto di sicurezza che aspetta il primo aggiornamento
    # fatto in un posto solo (§8.34).
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # SOLO SVILUPPO: HTTP in chiaro, nessun TLS, NESSUN HSTS.
    #
    # L'assenza di HSTS qui non è una dimenticanza: lo sviluppo usa porte non
    # standard (8080), e un HSTS visto una volta su un host resterebbe memorizzato
    # dal browser, che poi trasformerebbe http://host:8080 in https://host:8080 —
    # dove non c'è TLS. Vedi §8.31.
    #
    # Usato da compose.dev.yaml. Non finisce nell'immagine di produzione.
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;

        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # ---------------- API ----------------
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            # Le intestazioni `X-Forwarded-*` si SOVRASCRIVONO, mai si accodano
            # e mai si lasciano passare (§8.34). Sono le uniche affermazioni che
            # l'API accetta da noi, e quindi devono venire da noi soltanto.
            #
            # `$remote_addr` e NON `$proxy_add_x_forwarded_for`: quest'ultimo
            # ACCODA l'IP reale a un eventuale header del client, quindi un
            # `X-Forwarded-For: 1.2.3.4` inviato dall'esterno arriverebbe all'API
            # come "1.2.3.4, <ip reale>". L'API prende un valore da quella lista e
            # il chiamante avrebbe scelto il proprio indirizzo — aggirando il
            # limitatore dei tentativi di accesso semplicemente cambiando stringa.
            #
            # `X-Forwarded-Host` va impostato ANCHE SE non ci serve valorizzarlo
            # diversamente da `$host`: se non lo si scrive, quello del client passa
            # intatto, e l'API — che si fida degli header quando il peer è il proxy
            # — costruirebbe l'origine attesa con un valore scelto dall'attaccante.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # L'inventario non si mette in cache da nessuna parte: l'API manda
            # no-store, e qui non si aggiunge nulla che possa contraddirlo.
            proxy_buffering off;
        }

        # ------------- file statici in allowlist (§6) -------------
        # L'immagine contiene SOLO questi file: quello che non è stato copiato non
        # può essere servito nemmeno da una regola scritta male in futuro.
        location = / {
            root /srv/app;
            try_files /index.html =404;
        }

        location = /support.js { root /srv/app; }
        location = /xlsx.js    { root /srv/app; }
        location = /identity.js { root /srv/app; }
        location = /domain.js  { root /srv/app; }
        location = /api.js     { root /srv/app; }
        location = /queries.js { root /srv/app; }
        location = /trust-logo.png      { root /srv/app; }
        location = /trust-logo-dark.png { root /srv/app; }

        # ⚠ NESSUN `add_header` in questi due blocchi, e non è una semplificazione.
        #
        # In nginx `add_header` NON si somma fra livelli: una sola direttiva dentro
        # un `location` SCARTA tutte quelle ereditate dal blocco `server`, e
        # `always` non cambia questa regola — cambia solo il comportamento sulle
        # risposte di errore. Un `add_header Cache-Control "public, immutable"`
        # aggiunto qui portava quindi via, da queste due sole location, tutte e
        # quattro le intestazioni di sicurezza dichiarate sopra.
        #
        # Trovato dalla qualificazione della 2J chiedendo le intestazioni al
        # SERVER invece di leggerle nel file: `/` e `/domain.js` avevano
        # `X-Content-Type-Options: nosniff`, `/vendor/react.production.min.js` e
        # `/fonts/PublicSans-400.woff2` no. Cioè mancava esattamente sulle
        # risposte dove conta — il JavaScript vendorizzato — perché il MIME
        # sniffing di una risposta script è il caso classico che `nosniff` esiste
        # per chiudere. Il file continuava a dichiarare l'intestazione, e
        # un'ispezione statica avrebbe detto che c'era.
        #
        # `expires 30d` emette già `Cache-Control: max-age=2592000` da solo, senza
        # toccare l'ereditarietà: si perde `immutable`, cioè una richiesta
        # condizionale ogni trenta giorni per una manciata di file su una rete
        # chiusa, e si riprendono le intestazioni di sicurezza su ogni risposta.
        #
        # Chi aggiungerà un `add_header` qui dentro deve ricopiarsi anche quelle
        # quattro. Meglio non aggiungerne.
        location ^~ /vendor/ {
            root /srv/app;
            expires 30d;
        }
        location ^~ /fonts/ {
            root /srv/app;
            expires 30d;
        }

        # Default deny: nessun autoindex, nessuna directory servita in blocco.
        location / { return 404; }
    }
}
